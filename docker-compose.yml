services:
  mysql:
    image: mysql:8.0
    container_name: nestjs-api-template-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: app
    ports:
      - '3306:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-ppassword']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
