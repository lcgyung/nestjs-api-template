# pnpm 설정 (pnpm 10+ 부터 package.json "pnpm" 필드 대신 여기서 읽는다).
# bcrypt 는 네이티브 빌드(node-gyp)가 필요하므로 빌드 스크립트 실행을 허용한다.
# (@scarf/scarf 는 분석용 postinstall 이라 실행하지 않는다.)
# testcontainers 의존성(cpu-features/ssh2/protobufjs)은 JS 폴백으로 동작하므로 빌드 불허
# (ssh2 네이티브 가속은 원격 docker SSH 포워딩용 — 로컬 소켓 사용엔 불필요).
allowBuilds:
  bcrypt: true
  '@scarf/scarf': false
  cpu-features: false
  protobufjs: false
  ssh2: false
  # jest 30 의 의존성 unrs-resolver(napi 리졸버)는 JS 폴백으로 동작 — 네이티브 빌드 불요
  unrs-resolver: false

# bcrypt > @mapbox/node-pre-gyp 가 tar ^6 을 끌고 오는데, 6.x 라인엔 high CVE 패치가 없다
# (GHSA-34x7-hfp2-rc4v 외 5건, 패치는 7.5.11+). node-pre-gyp 의 tar 사용부(extract)는 7.x 와 호환.
overrides:
  tar: ^7.5.11
  # @nestjs/platform-express 가 끌고 오는 multer <2.2.0 의 DoS 2건을 패치 버전으로 승격한다
  # (GHSA-72gw-mp4g-v24j: HIGH, 깊게 중첩된 필드명 / GHSA-3p4h-7m6x-2hcm: 중단된 업로드 정리 누락).
  # 앱은 파일 업로드를 사용하지 않는 transitive 의존성이며, 2.x 동일 메이저 내 patch 범프라 호환.
  multer: ^2.2.0
  # @nestjs/swagger 가 끌고 오는 js-yaml 의 quadratic CPU DoS 3건을 패치 버전으로 승격한다.
  #   GHSA-h67p-54hq-rp68 (<4.1.2, merge-key) / GHSA-52cp-r559-cp3m (<4.3.0, merge-key 체인)
  #   GHSA-5p4m-2wfm-xmqj (<4.3.1, !!omap 해석 — CVE-2026-59870 백포트 누락)
  # 4.3.1 은 js-yaml 의 `v4-legacy` dist-tag(4.x 패치 라인) — 5.x 메이저 범프 없이 해소된다.
  # OpenAPI YAML 직렬화 경로에서만 쓰이는 transitive 의존성이고, 4.x 동일 메이저 내 범프라 호환.
  js-yaml: ^4.3.1
