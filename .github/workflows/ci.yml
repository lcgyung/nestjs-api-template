name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint-build-test:
    name: Lint · Build · Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test:cov
      # OpenAPI 스펙 드리프트 게이트 — 커밋된 docs/openapi.json 이 코드와 일치해야 한다
      - run: pnpm openapi:generate
      - run: git diff --exit-code -- docs/openapi.json

  security:
    name: Security (gitleaks · pnpm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 히스토리 포함 시크릿 스캔 (리포가 작아 비용 미미)
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 런타임 의존성만 게이트 — dev 취약점은 Dependabot PR 로 처리
      - run: pnpm audit --prod --audit-level=high

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    # private Free repo 라 CodeQL 불가 → Semgrep 레지스트리 룰셋(토큰 불필요)으로 게이트.
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - run: semgrep scan --config p/typescript --config p/nodejs --config p/owasp-top-ten --error --metrics=off

  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    # 소프트웨어 자재명세서 생성 — 게이트 아님(아티팩트만, 실패해도 머지 비차단)
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm dlx @cyclonedx/cdxgen@latest -t pnpm -o sbom.json
        env:
          FETCH_LICENSE: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

  e2e:
    name: E2E (PostgreSQL)
    # DB 의존 단계(마이그레이션/시드/e2e)는 기본 스킵. 리포지토리 변수 RUN_E2E=true 일 때만 실행.
    # 활성화: Settings → Secrets and variables → Actions → Variables → New repository variable
    #   Name: RUN_E2E  /  Value: true
    if: ${{ vars.RUN_E2E == 'true' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d app"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: app
      DB_USERNAME: postgres
      DB_PASSWORD: password
      JWT_SECRET: ci-test-secret-at-least-16-chars
      JWT_EXPIRES_IN: 1d
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm migration:run
      - run: pnpm seed
      - run: pnpm test:e2e
