name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# 토큰 기본 권한 최소화 — 명시하지 않은 스코프는 none. 잡별로 필요한 만큼만 확대한다.
permissions:
  contents: read

jobs:
  lint-build-test:
    name: Lint · Build · Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # 훅 회귀 가드 — guard-bash/guard-psql/gate/review-gate 의 .test.sh (jq·git 만 필요, claude 는 스텁)
      - run: pnpm check:hooks
      - run: pnpm build
      - run: pnpm test:cov
      # 마이그레이션 데이터 손실 가드(DB 불필요) — up() 의 미승인 파괴적 DDL 차단
      - run: pnpm check:migrations
      # OpenAPI 스펙 드리프트 게이트 — 커밋된 docs/openapi.json 이 코드와 일치해야 한다
      - run: pnpm openapi:generate
      - run: git diff --exit-code -- docs/openapi.json

  security:
    name: Security (gitleaks · pnpm audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          # 히스토리 포함 시크릿 스캔 (리포가 작아 비용 미미)
          fetch-depth: 0
      # 시크릿 스캔(전체 히스토리) — 핀 고정 Docker 로 통일(gitleaks-action 의 GITLEAKS_LICENSE·
      # PR fetch 권한 의존 제거). .gitleaks.toml 의 allowlist 를 적용한다.
      - name: Secret scan (gitleaks, 전체 히스토리)
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --no-banner --config=/repo/.gitleaks.toml
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 런타임 의존성만 게이트 — dev 취약점은 Dependabot PR 로 처리
      - run: pnpm audit --prod --audit-level=high

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    # private Free repo 라 CodeQL 불가 → Semgrep 레지스트리 룰셋(토큰 불필요)으로 게이트.
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v6
      - run: semgrep scan --config p/typescript --config p/nodejs --config p/owasp-top-ten --error --metrics=off

  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    # 소프트웨어 자재명세서 생성 — 게이트 아님(아티팩트만, 실패해도 머지 비차단)
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm dlx @cyclonedx/cdxgen@latest -t pnpm -o sbom.json
        env:
          FETCH_LICENSE: 'false'
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.json

  e2e:
    name: E2E (testcontainers)
    # DB 의존 단계는 기본 스킵. 리포지토리 변수 RUN_E2E=true 일 때만 실행.
    # 활성화: Settings → Secrets and variables → Actions → Variables → New repository variable
    #   Name: RUN_E2E  /  Value: true
    # DB·마이그레이션·시드는 jest globalSetup 이 testcontainers 로 자체 처리한다 (ADR 0009).
    if: ${{ vars.RUN_E2E == 'true' }}
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      JWT_SECRET: ci-test-secret-at-least-16-chars
      JWT_EXPIRES_IN: 1d
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:e2e
